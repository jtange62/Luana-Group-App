<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#DDF3E6" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
<title>Luana Group App</title>
<meta name="description" content="Staff tools for Luana English School." />
<meta property="og:title" content="Luana Group App" />
<meta property="og:description" content="Staff tools for Luana English School." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/shared.css" />
<link rel="stylesheet" href="/board.css" />
</head>
<body>
<div id="app">

  <!-- Login gate -->
  <main id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-logo"><img src="/icons/login-logo-96.png" width="96" height="96" fetchpriority="high" alt="Luana English School" /></div>
      <h1 class="gate-title">Luana Group App</h1>
      <p class="gate-sub">Staff tools — enter the password to continue</p>
      <label class="gate-label" for="pwInput">Staff password</label>
      <input id="pwInput" type="password" placeholder="Enter the shared password" autocomplete="current-password" />
      <label class="gate-label" for="gateName">Your name</label>
      <input id="gateName" type="text" placeholder="e.g. Jane" autocomplete="name" />
      <button id="enterBtn" class="btn-primary">Open staff tools</button>
      <p id="gateError" class="gate-error" hidden></p>
    </div>
  </main>

  <!-- The board: capture anything, then file it where it belongs -->
  <div id="board" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="/icons/favicon-32.png" alt="" class="brand-mark" />
          <span class="brand-name">Luana Group App</span>
        </div>
        <button id="signOut" class="icon-btn" aria-label="Sign out" title="Sign out">⎋</button>
      </div>
      <p class="brand-tag">Jot it down now, sort it out later</p>
    </header>

    <section class="composer">
      <textarea id="ideaInput" rows="2" aria-label="Your idea" placeholder="Write your idea here…"></textarea>
      <div id="ideaFileRow" class="file-row">
        <label class="file-label">📎 Attach
          <input id="ideaFiles" type="file" multiple hidden />
        </label>
        <span id="ideaFileList" class="file-chosen"></span>
      </div>
      <div class="composer-row">
        <span id="postingAs" class="posting-as"></span>
        <select id="catSelect" class="cat-select" aria-label="Category">
          <option value="curriculum">curriculum</option>
          <option value="events">events</option>
          <option value="supplies">supplies</option>
          <option value="general">general</option>
        </select>
        <button id="postBtn" class="btn-primary btn-sm">Post</button>
      </div>
    </section>

    <nav id="tabs" class="tabs" aria-label="Categories"></nav>

    <main id="feed" class="feed" aria-live="polite"></main>
    <div id="empty" class="empty" hidden>
      <span class="empty-icon">✎</span>
      <p>Nothing here yet — be the first to post.</p>
    </div>
    <div id="loading" class="loading">Loading…</div>
    <button id="loadMore" class="load-more" hidden>Load older ideas</button>

    <footer class="board-footer">
      <a class="more-link" href="/tools/">All tools <span aria-hidden="true">→</span></a>
    </footer>
  </div>

  <!-- Send an idea into the curriculum -->
  <div id="placeModal" class="modal" hidden>
    <div class="modal-card">
      <p id="placeHeading" class="form-heading">Send to curriculum</p>
      <p id="placePreview" class="place-preview"></p>
      <label class="field-label" for="placeTarget">Where does this go?</label>
      <select id="placeTarget" class="form-select"></select>
      <label class="field-label" for="placeField">Which part?</label>
      <select id="placeField" class="form-select"></select>
      <p class="place-hint">It gets added to whatever is already there — nothing is overwritten.</p>
      <div class="modal-actions">
        <span id="placeMsg" class="form-msg"></span>
        <button id="placeCancel" class="btn-ghost">Cancel</button>
        <button id="placeGo" class="btn-primary btn-sm">Send</button>
      </div>
    </div>
  </div>

  <!-- Photo lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lbClose" class="lb-close" aria-label="Close">✕</button>
    <img id="lbImg" class="lb-img" src="" alt="Photo" />
    <button id="lbPrev" class="lb-nav lb-prev" aria-label="Previous">‹</button>
    <button id="lbNext" class="lb-nav lb-next" aria-label="Next">›</button>
    <div id="lbCounter" class="lb-counter"></div>
  </div>
</div>

<script src="/shared-auth.js"></script>
<script src="/shared-utils.js"></script>
<script src="/board.js"></script>
</body>
</html>
