<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#DDF3E6" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
<title>Luana Group App</title>
<meta name="description" content="Staff tools for Luana English School." />
<meta property="og:title" content="Luana Group App" />
<meta property="og:description" content="Staff tools for Luana English School." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/shared.css" />
<link rel="stylesheet" href="/today.css" />
</head>
<body>
<div id="app">

  <!-- Login gate -->
  <main id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-logo"><img src="/icons/login-logo-96.png" width="96" height="96" fetchpriority="high" alt="Luana English School" /></div>
      <h1 class="gate-title">Luana Group App</h1>
      <p class="gate-sub">Staff tools — enter the password to continue</p>
      <label class="gate-label" for="pwInput">Staff password</label>
      <input id="pwInput" type="password" placeholder="Enter the shared password" autocomplete="current-password" />
      <label class="gate-label" for="gateName">Your name</label>
      <input id="gateName" type="text" placeholder="e.g. Jane" autocomplete="name" />
      <button id="enterBtn" class="btn-primary">Open staff tools</button>
      <p id="gateError" class="gate-error" hidden></p>
    </div>
  </main>

  <!-- Today — the register, plus what the day already knows (hidden until authed) -->
  <div id="today" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="/icons/favicon-32.png" alt="" class="brand-mark" />
          <span class="brand-name">Luana Group App</span>
        </div>
        <button id="signOut" class="icon-btn" aria-label="Sign out" title="Sign out">⎋</button>
      </div>
      <p class="brand-tag" id="dayLabel">Today</p>
    </header>

    <main class="today-main">
    <div class="daybar">
      <button id="dayPrev" class="nav-btn" aria-label="Previous day">‹</button>
      <p id="dayCount" class="day-count" aria-live="polite">—</p>
      <button id="dayNext" class="nav-btn" aria-label="Next day">›</button>
      <button id="dayToday" class="btn-ghost btn-tiny" hidden>Today</button>
    </div>

    <p id="loading" class="loading">Loading…</p>

    <section id="alerts" class="alerts" hidden aria-labelledby="alertsHead">
      <h2 id="alertsHead" class="alerts-head">Allergies in the building today</h2>
      <ul id="alertsList" class="alerts-list"></ul>
    </section>

    <div id="register" class="register"></div>

    <p id="empty" class="empty" hidden></p>

    <section id="onToday" class="on-today" hidden aria-labelledby="onTodayHead">
      <h2 id="onTodayHead" class="section-head">On today</h2>
      <ul id="onTodayList" class="event-list"></ul>
    </section>
    </main>

    <footer class="today-footer">
      <button id="digestBtn" class="btn-ghost btn-wide">📋 Copy today’s summary</button>
      <a class="more-link" href="/tools/">All tools <span aria-hidden="true">→</span></a>
    </footer>
  </div>

  <!-- Summary preview -->
  <div id="digest" class="modal" hidden>
    <div class="modal-card">
      <p id="digestHeading" class="form-heading">Today’s summary</p>
      <pre id="digestText" class="digest-text"></pre>
      <div class="modal-actions">
        <button id="digestCopy" class="btn-ghost">Copy</button>
        <button id="digestClose" class="btn-primary btn-tiny">Done</button>
      </div>
    </div>
  </div>

</div>
<script src="/shared-auth.js"></script>
<script src="/shared-utils.js"></script>
<script src="/today.js"></script>
</body>
</html>
