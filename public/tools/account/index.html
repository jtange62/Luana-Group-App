<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Staff account · Luana</title><link rel="stylesheet" href="/shared.css"/><link rel="stylesheet" href="./account.css"/></head>
<body><div id="app"><header class="topbar"><div class="topbar-inner"><a class="back-btn" href="/">‹ Back</a><h1>Staff account</h1><button id="signOut">Sign out</button></div></header>
<main><p id="identity"></p><p id="message" role="status"></p>
<form id="passwordForm"><h2>Change password</h2><p>Use at least 14 characters. A long phrase works well.</p>
<label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="200"/>
<label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="14" maxlength="200"/>
<label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="14" maxlength="200"/>
<button class="btn-primary">Save password</button></form>
<section id="admin" hidden><h2>Staff access</h2><form id="addStaff">
<label for="staffUsername">Username</label><input id="staffUsername" required pattern="[a-zA-Z0-9._-]{3,60}" autocomplete="off"/>
<label for="staffName">Display name</label><input id="staffName" required maxlength="60"/>
<label for="staffPassword">Temporary password</label><input id="staffPassword" type="password" minlength="14" maxlength="200" required autocomplete="new-password"/>
<button class="btn-primary">Add staff member</button></form>
<form id="resetStaff" hidden><h3 id="resetHeading">Reset staff password</h3><label for="resetPassword">New temporary password</label><input id="resetPassword" type="password" autocomplete="new-password" minlength="14" maxlength="200" required/><button class="btn-primary">Save temporary password</button><button type="button" id="cancelReset">Cancel</button></form><div id="staffList"></div>
<h2>Recent changes</h2><p>Shows who performed each successful action. Existing records retain their original bylines.</p><ul id="audit"></ul></section>
</main></div><script src="/shared-auth.js"></script><script src="/shared-utils.js"></script><script src="./account.js"></script></body></html>
